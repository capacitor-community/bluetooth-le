# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm ci
      - run: npm run lint

  verify-web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: rm package-lock.json
      - run: npm install
      - run: npm run verify:web

  verify-android:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - agp: '8.13.0'
            gradle: '8.14.3'
          - agp: '9.1.1'
            gradle: '9.3.1'
    name: verify-android (AGP ${{ matrix.agp }} / Gradle ${{ matrix.gradle }})
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
      - run: npm ci
      - name: Update Gradle wrapper to ${{ matrix.gradle }}
        working-directory: android
        run: ./gradlew wrapper --gradle-version=${{ matrix.gradle }} --distribution-type=all
      - name: Build & test with AGP ${{ matrix.agp }}
        working-directory: android
        run: ./gradlew clean build test -PagpVersion=${{ matrix.agp }}

  verify-ios:
    runs-on: macos-15
    steps:
      # https://github.com/actions/virtual-environments/blob/main/images/macos/macos-15-Readme.md#xcode
      - run: sudo xcode-select --switch /Applications/Xcode_26.1.1.app
      - run: xcrun simctl list
      - run: xcodebuild -downloadPlatform iOS
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm ci
      - run: npm run verify:ios
